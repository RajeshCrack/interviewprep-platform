# Judge0 CE 1.13.1 runs students' code, so it gets its own server and nothing else lives there.
# Requirements: Ubuntu 22.04 with cgroup v1 (see DEPLOY.md), a firewall that only lets the API server reach port 2358.
# Check these settings against the docker-compose.yml and judge0.conf of the Judge0 release you deploy.
x-judge0-env: &judge0-env
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/judge0/.env}
  POSTGRES_HOST: db
  POSTGRES_DB: judge0
  POSTGRES_USER: judge0
  POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:?set JUDGE0_DB_PASSWORD in deploy/judge0/.env}
  SECRET_KEY_BASE: ${JUDGE0_SECRET_KEY_BASE:?set JUDGE0_SECRET_KEY_BASE in deploy/judge0/.env}
  AUTHN_HEADER: X-Auth-Token
  AUTHN_TOKEN: ${JUDGE_TOKEN:?set JUDGE_TOKEN in deploy/judge0/.env}
  ENABLE_WAIT_RESULT: "true"
  ALLOW_ENABLE_NETWORK: "false"   # student code never gets network access
  MAX_QUEUE_SIZE: "200"

services:
  judge0:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    privileged: true            # isolate needs it to build the sandbox
    ports: ["${JUDGE0_BIND_IP:?set JUDGE0_BIND_IP in deploy/judge0/.env}:2358:2358"]
    environment: *judge0-env
    depends_on: [db, redis]

  workers:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    privileged: true
    command: ["./scripts/workers"]
    environment: *judge0-env
    depends_on: [db, redis]

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:?set JUDGE0_DB_PASSWORD in deploy/judge0/.env}
    volumes: [judge0_db:/var/lib/postgresql/data]

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/judge0/.env}"]

volumes:
  judge0_db:
