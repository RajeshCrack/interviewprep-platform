spring:
  application:
    name: gateready-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gateready}
    username: ${DB_USER:gateready}
    password: ${DB_PASSWORD:gateready}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  # Behind Caddy the real client address arrives in X-Forwarded-For. Without this every student shares the
  # proxy's address and the login rate limiter would lock everyone out together. The API port must never be
  # published to the internet, only the proxy may reach it.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  zone: ${APP_ZONE:Asia/Kolkata}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    # Must be at least 32 characters. Set JWT_SECRET in every real environment.
    secret: ${JWT_SECRET:}
    access-minutes: 15
    refresh-days: 30
  reminders:
    enabled: true
  mail:
    from: ${MAIL_FROM:no-reply@gateready.local}
  judge:
    # disabled (default), local (development only, not sandboxed) or judge0 (production)
    mode: ${JUDGE_MODE:disabled}
    url: ${JUDGE_URL:}
    token: ${JUDGE_TOKEN:}
    time-limit-seconds: 3
